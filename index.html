<style>
  /* Paleta: índigo, rojo ladrillo y verde musgo oscuro, con crema y mostaza de las portadas */
  :root {
    --indigo: #2b2275;
    --indigo-deep: #17123f;
    --brick: #a3442c;
    --moss: #2f3a1b;
    --moss-light: #4d5c2b;
    --cream: #f6eed6;
    --mustard: #e3b53b;
    --ink: #0e0c0a;
    --shade: rgba(14, 12, 10, .45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--indigo-deep); color: var(--cream); font-family: "Roboto Serif", Georgia, serif; overflow: hidden; }

  /* Fondo: remolino como Planeta Ambiente */
  .swirl {
    position: fixed; inset: -50vmax;
    background: conic-gradient(from 0deg at 50% 50%,
      var(--indigo) 0deg, var(--moss) 50deg, var(--brick) 95deg, var(--indigo-deep) 140deg,
      var(--moss-light) 185deg, var(--indigo) 230deg, var(--brick) 285deg, var(--moss) 325deg, var(--indigo) 360deg);
    filter: blur(28px);
    animation: turn 140s linear infinite;
  }
  @keyframes turn { to { transform: rotate(360deg); } }
  .vignette { position: fixed; inset: 0; background: radial-gradient(circle at 50% 50%, transparent 35%, rgba(10, 8, 20, .7) 100%); }
  .grain { position: fixed; inset: 0; opacity: .22; mix-blend-mode: overlay; pointer-events: none; }
  /* Rayones circulares tipo vinilo gastado, como Warm Tarde */
  .scratches { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .18; }

  .stage { position: fixed; inset: 0; display: grid; place-items: center; z-index: 2; padding: 64px 0 96px; }
  .orb { width: min(92vmin, calc(100vh - 220px), 720px); aspect-ratio: 1; position: relative; animation: float 8s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-12px) rotate(.6deg); } }
  .orb svg { width: 100%; height: 100%; overflow: visible; }

  .arch { font-family: "Bowlby One", sans-serif; }
  .token { cursor: pointer; }
  .token .disc { transition: transform .15s; transform-box: fill-box; transform-origin: center; }
  .token:hover .disc { transform: scale(1.12); }
  .eye-lid { animation: blink 7s infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }

  /* Brillos ocultos */
  .glint { position: fixed; width: 26px; height: 26px; z-index: 4; cursor: pointer; transform: translate(-50%, -50%); opacity: .1; animation: twinkle 8s ease-in-out infinite; }
  .glint svg { width: 100%; height: 100%; }
  .glint:hover { opacity: 1; }
  .glint.found { opacity: 1; animation: none; }
  .glint.found path { fill: var(--mustard); }
  @keyframes twinkle { 0%, 82%, 100% { opacity: .1; transform: translate(-50%, -50%) scale(.8); } 90% { opacity: 1; transform: translate(-50%, -50%) scale(1.15) rotate(45deg); } }

  /* Tarjeta tipo sticker */
  .reveal {
    position: fixed; left: 50%; bottom: 128px; z-index: 6;
    width: min(290px, calc(100vw - 48px)); padding: 14px 34px 14px;
    background: var(--cream); color: var(--ink); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
    text-align: center; opacity: 0; pointer-events: none;
    transform: translate(-50%, 24px) rotate(-2deg); transition: opacity .35s, transform .35s;
  }
  .reveal.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0) rotate(-2deg); }
  .reveal .close {
    position: absolute; top: -14px; right: -14px; width: 30px; height: 30px;
    display: grid; place-items: center; cursor: pointer;
    background: var(--brick); color: var(--cream); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
    font-family: "Bowlby One", sans-serif; font-size: .9rem; line-height: 1;
  }
  .reveal .close:hover { background: var(--mustard); color: var(--ink); }
  .reveal .sym { font-size: 1.6rem; line-height: 1; color: var(--brick); }
  .reveal h3 { font-family: "Bowlby One", sans-serif; font-weight: 400; font-size: 1.1rem; letter-spacing: .04em; color: var(--indigo); text-shadow: 2px 2px 0 var(--mustard); margin: 4px 0 4px; }
  .reveal p { font-size: .95rem; font-weight: 700; font-variation-settings: "wdth" 60; }
  .reveal .note { margin-top: 8px; font-family: "Bowlby One", sans-serif; font-size: .7rem; letter-spacing: .08em; color: var(--brick); }
  .reveal .note:empty { display: none; }
  .token.ringing .disc { animation: ringing .9s ease-out; }
  @keyframes ringing { 0% { transform: scale(1.3); } 100% { transform: scale(1); } }

  /* Redes: cuadraditos tipo sticker, como un Linktree */
  .socials { position: fixed; top: 16px; left: 0; right: 0; z-index: 5; display: flex; justify-content: center; flex-wrap: wrap; gap: clamp(8px, 2vw, 14px); padding: 0 16px; }
  .socials a {
    width: clamp(42px, 10vw, 50px); aspect-ratio: 1; display: grid; place-items: center;
    background: var(--cream); color: var(--ink); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
    transition: transform .12s, box-shadow .12s, background .12s;
  }
  .socials a:nth-child(3n+2) { background: var(--mustard); }
  .socials a:nth-child(3n) { background: var(--brick); color: var(--cream); }
  .socials a:hover { transform: translate(2px, 2px) rotate(-4deg); box-shadow: 2px 2px 0 var(--ink); }
  .socials svg { width: 58%; height: 58%; }

  footer { position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 16px clamp(16px, 4vw, 36px); }
  .btn {
    font-family: "Bowlby One", sans-serif; font-size: .9rem; letter-spacing: .04em; text-decoration: none;
    padding: 10px 16px; background: var(--cream); color: var(--ink); border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink);
    transition: transform .12s, box-shadow .12s;
  }
  .btn:hover { transform: translate(2px, 2px); box-shadow: 3px 3px 0 var(--ink); }
  .btn.red { background: var(--brick); color: var(--cream); }
  .count { font-family: "Bowlby One", sans-serif; color: var(--cream); font-size: .75rem; text-shadow: 2px 2px 0 var(--ink); }
  /* Sello del perro: el guardián de la página */
  .seal { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .seal button { background: none; border: 0; padding: 0; cursor: pointer; width: clamp(64px, 9vw, 84px); aspect-ratio: 520 / 584; filter: drop-shadow(4px 5px 0 rgba(14, 12, 10, .55)); transition: transform .25s; }
  .seal button:hover { transform: rotate(-8deg) scale(1.06); }
  .seal img { width: 100%; height: 100%; display: block; }
</style>
</head>

  planets.forEach((p, i) => {
    const a = (i / planets.length) * Math.PI * 2 - Math.PI / 2, r = 222;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "token");
    g.setAttribute("transform", `translate(${x},${y})`);
    const dark = p.c.includes("brick") || p.c.includes("moss");
    g.innerHTML = `
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="160s" repeatCount="indefinite"/>
        <g class="disc">
          <circle r="31" cx="5" cy="6" fill="var(--ink)"/>
          <circle r="31" fill="${p.c}" stroke="var(--ink)" stroke-width="4"/>
          <text text-anchor="middle" dominant-baseline="central" font-size="32" font-weight="700"
            fill="${dark ? "var(--cream)" : "var(--ink)"}" font-family="DejaVu Sans, Segoe UI Symbol, sans-serif">${p.s}</text>
        </g>
      </g>`;
    g.addEventListener("click", () => { ring(p.h); pulse(g); show(p.s, p.t, p.x, noteLabel(p.h)); });
    tg.appendChild(g);
  });


  // Serie de armónicos: cada planeta es un armónico de la misma fundamental.
  // Saturno (el más lejano) es la fundamental y la Luna el 7º, como en la música de las esferas.
  const FUNDAMENTAL = 65.41; // Do2. Cambiar para afinar en la tonalidad de las canciones.
  const NAMES = { 1: "Do", 2: "Do", 3: "Sol", 4: "Do", 5: "Mi", 6: "Sol", 7: "Si♭" };
  const CENTS = { 5: "−14¢", 7: "−31¢" };
  const ORD = ["", "fundamental", "2º", "3º", "4º", "5º", "6º", "7º"];
  function noteLabel(h) {
    const hz = Math.round(FUNDAMENTAL * h);
    return `ARMÓNICO ${ORD[h].toUpperCase()} · ${NAMES[h].toUpperCase()}${CENTS[h] ? " " + CENTS[h] : ""} · ${hz} HZ`;
  }
  let ac, master;
  function audio() {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = .5;
      // eco suave para que suene a espacio
      const delay = ac.createDelay(); delay.delayTime.value = .38;
      const fb = ac.createGain(); fb.gain.value = .35;
      const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2200;
      master.connect(ac.destination);
      master.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(ac.destination);
    }
    if (ac.state === "suspended") ac.resume();
    return ac;
  }
  function ring(h) {
    const a = audio(), t = a.currentTime, f = FUNDAMENTAL * h;
    // los graves suenan más fuerte para que se sientan igual de presentes
    const level = .32 / Math.sqrt(h);
    const env = a.createGain();
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(level, t + .02);
    env.gain.exponentialRampToValueAtTime(.0008, t + 4.5);
    env.connect(master);
    // seno puro + un brillo suave arriba, tipo campana de vidrio
    [[1, 1], [2, .18], [3, .06]].forEach(([m, g]) => {
      const o = a.createOscillator(), og = a.createGain();
      o.type = "sine"; o.frequency.value = f * m; o.detune.value = (Math.random() - .5) * 4;
      og.gain.value = g; o.connect(og); og.connect(env);
      o.start(t); o.stop(t + 4.6);
    });
  }
  function pulse(g) { g.classList.remove("ringing"); void g.getBBox(); g.classList.add("ringing"); }

  // Tocar el ojo hace sonar los siete armónicos juntos, en arpegio
  document.querySelector(".eye-lid").style.cursor = "pointer";
  document.querySelector(".eye-lid").addEventListener("click", () => {
    [1, 2, 3, 4, 5, 6, 7].forEach((h, i) => setTimeout(() => ring(h), i * 110));
  });

  // El ojo sigue al cursor
  const iris = document.getElementById("iris"), pupil = document.getElementById("pupil"), shine = document.getElementById("shine");
  addEventListener("pointermove", e => {
    const dx = (e.clientX / innerWidth - .5) * 2, dy = (e.clientY / innerHeight - .5) * 2;
    const t = `translate(${dx * 30},${dy * 12})`;
    for (const el of [iris, pupil, shine]) el.setAttribute("transform", t);
  });

  // Brillos ocultos
  const secrets = [
    { s: "🜍", t: "Azufre", x: "El alma. Un demo que nadie ha escuchado." },
    { s: "🜔", t: "Sal", x: "El cuerpo. Fotos del estudio." },
    { s: "☿", t: "Mercurio", x: "El espíritu. Una letra inédita." },
    { s: "🜂", t: "Fuego", x: "Una fecha secreta." },
    { s: "🜄", t: "Agua", x: "Warm Tarde, versión cruda." },
    { s: "🜁", t: "Aire", x: "Lo que estoy escuchando." },
    { s: "🜃", t: "Tierra", x: "Aquí podría aparecer el perro." },
  ];
  const spots = [[10, 18], [88, 14], [7, 62], [93, 56], [20, 84], [80, 80], [50, 6]];
  let found = 0;
  // El perro: guardián del vacío
  document.getElementById("dog").addEventListener("click", () => {
    ring(1); setTimeout(() => ring(5), 160);
    show("無", "Tieneunperro", "El guardián del vacío. Te estaba esperando.");
  });
  secrets.forEach((s, i) => {
    const el = document.createElement("div");
    el.className = "glint";
    el.style.left = spots[i][0] + "%"; el.style.top = spots[i][1] + "%";
    el.style.animationDelay = (i * 1.4) + "s";
    el.innerHTML = `<svg viewBox="-10 -10 20 20"><path d="M0,-10 C1,-2 2,-1 10,0 C2,1 1,2 0,10 C-1,2 -2,1 -10,0 C-2,-1 -1,-2 0,-10Z" fill="var(--cream)" stroke="var(--ink)" stroke-width=".8"/></svg>`;
    el.addEventListener("click", () => {
      if (!el.classList.contains("found")) { el.classList.add("found"); found++; document.getElementById("count").textContent = `${found} / ${secrets.length}`; }
      show(s.s, s.t, s.x);
    });
    document.body.appendChild(el);
  });

  function show(sym, title, text, note = "") {
    document.getElementById("r-note").textContent = note;
    document.getElementById("r-sym").textContent = sym;
    document.getElementById("r-title").textContent = title.toUpperCase();
    document.getElementById("r-text").textContent = text;
    const r = document.getElementById("reveal");
    r.classList.add("show");
  }
  document.getElementById("r-close").addEventListener("click", () => document.getElementById("reveal").classList.remove("show"));
  addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("reveal").classList.remove("show"); });
</script>
</body>
</html>
